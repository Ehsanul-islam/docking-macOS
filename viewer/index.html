<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dock viewer</title>
<link rel="stylesheet" href="vendor/molstar.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="stage">
  <div id="canvas"></div>

  <div id="empty" class="empty">
    <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 6 54 19v26L32 58 10 45V19z" opacity=".5"/><path d="M32 6v52M10 19l44 26M54 19 10 45" opacity=".25"/><circle cx="32" cy="32" r="5.5"/></g></svg>
    <div class="empty-title">Nothing to show yet</div>
    <div class="empty-sub">Choose a structure and the 3D view appears here.</div>
  </div>

  <div id="busy" class="busy hidden"><div class="spinner"></div><span id="busy-text">Loading…</span></div>

  <header id="chips" class="glass chips hidden">
    <span id="chip-title" class="chip-title"></span>
    <span id="chip-score" class="chip-score"></span>
  </header>

  <nav id="toolbar" class="glass toolbar" aria-label="View controls">
    <button data-opt="cartoon"      title="Protein cartoon"><svg viewBox="0 0 24 24"><path d="M3 15c3-9 5 3 8-4s5 4 10-4" /></svg></button>
    <button data-opt="surface"      title="Pocket surface"><svg viewBox="0 0 24 24"><path d="M5 14c-2-4 1-9 6-9s9 3 8 8-4 6-8 6-4-2-6-5z"/></svg></button>
    <button data-opt="pocket"       title="Pocket residues"><svg viewBox="0 0 24 24"><path d="M6 17 10 9l4 5 4-8M6 17h0M10 9h0M14 14h0M18 6h0"/></svg></button>
    <button data-opt="interactions" title="Interactions"><svg viewBox="0 0 24 24"><path d="M4 12h3M10 12h4M17 12h3" stroke-dasharray="0.1 0"/><circle cx="4" cy="12" r="1.6"/><circle cx="20" cy="12" r="1.6"/></svg></button>
    <button data-opt="labels"       title="Residue labels"><svg viewBox="0 0 24 24"><path d="M5 18 9.5 6h1L15 18M7 14h6M17 8h3M17 12h3M17 16h3"/></svg></button>
    <button data-opt="box"          title="Search box"><svg viewBox="0 0 24 24"><path d="M12 3 20 7.5v9L12 21l-8-4.500v-9zM12 12v9M12 12 4 7.500M12 12l8-4.500"/></svg></button>
    <span class="sep"></span>
    <button data-act="focus"        title="Focus on ligand"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.500"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button>
    <button data-act="reset"        title="Reset view"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.200M4 4v4h4"/></svg></button>
    <button data-opt="spin"         title="Rotate"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.200M20 4v4h-4"/></svg></button>
    <button data-act="shot"         title="Save image"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.500-2h7L17 8h3v11H4zM12 17a3.500 3.500 0 1 0 0-7 3.500 3.500 0 0 0 0 7z"/></svg></button>
    <button data-act="theme"        title="Light / dark"><svg viewBox="0 0 24 24"><path d="M20 14.500A8 8 0 0 1 9.500 4 8 8 0 1 0 20 14.500z"/></svg></button>
  </nav>

  <aside id="legend" class="glass legend hidden"></aside>
  <div id="poses" class="glass poses hidden" role="tablist" aria-label="Poses"></div>
</div>
<script src="vendor/molstar.js"></script>
<script src="app.js"></script>
</body>
</html>
