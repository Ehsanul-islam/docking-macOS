[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockmac"
version = "0.1.0"
description = "Structure cleaning and receptor/ligand preparation for docking on macOS"
requires-python = ">=3.10"
dependencies = [
    "gemmi",
    "numpy",
    "scipy",
    "rdkit",
    "meeko",
    "openmm",
    "pdbfixer",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dockmac = "dockmac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
